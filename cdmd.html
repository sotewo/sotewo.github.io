<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cthulhu: Death May Die (RNG)</title>
<style>
/* -------------------- FONT IMPORTS -------------------- */
@font-face {
  font-family: 'Metallophile Sp8';
  src: url('assets/fonts/Metallophile-Sp8-Regular.woff2') format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Metallophile Sp8';
  src: url('assets/fonts/Metallophile-Sp8-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Metallophile Sp8';
  src: url('assets/fonts/Metallophile-Sp8-Italic.woff2') format('woff2');
  font-weight: 400;
  font-style: italic;
  font-display: swap;
}
@font-face {
  font-family: 'Metallophile Sp8';
  src: url('assets/fonts/Metallophile-Sp8-Bold-Italic.woff2') format('woff2');
  font-weight: 700;
  font-style: italic;
  font-display: swap;
}

/* -------------------- CORE STYLES -------------------- */
body {
  font-family: 'Metallophile Sp8', 'Georgia', serif;
  background-color: #0e0e0e;
  color: #d6d2c4;
  margin: 0;
  padding: 20px;
  background-image: radial-gradient(#1b1b1b 1px, transparent 1px),
                    radial-gradient(#1b1b1b 1px, transparent 1px);
  background-size: 40px 40px;
  background-position: 0 0, 20px 20px;
}

a.back-button {
  position: fixed;
  top: 20px;
  left: 20px;
  font-size: 2em;
  text-decoration: none;
  color: #b0a06f;
  background-color: #1b1b1b;
  padding: 5px 12px;
  border-radius: 8px;
  box-shadow: 0 0 10px #000;
  transition: background-color 0.3s, transform 0.2s;
  z-index: 1000;
}
a.back-button:hover {
  background-color: #2a2a2a;
  transform: scale(1.1);
}

h1 {
  font-size: 2.5em;
  text-align: center;
  margin-bottom: 10px;
  color: #b0a06f;
  text-shadow: 1px 1px 2px #000;
}

/* -------------------- FILTER TABLE -------------------- */
.filter-table-container {
  max-width: 1200px;
  margin: 30px auto;
  padding: 15px;
  border: 1px dashed #5c3d3d;
  border-radius: 5px;
  background-color: #151515;
  color: #f0c080;
  font-size: 1em;
}
.filter-table-container h2 {
  text-align: center;
  color: #b0a06f;
  margin-bottom: 15px;
  text-shadow: 1px 1px 2px #000;
}
.filter-table {
  width: 100%;
  border-collapse: collapse;
}
.filter-table th, .filter-table td {
  border-bottom: 1px solid #333;
  padding: 8px 6px;
  text-align: left;
  vertical-align: middle;
}
.filter-table th.category {
  color: #b0a06f;
  font-weight: bold;
  width: 220px;
  white-space: nowrap;
}
.filter-buttons {
  display: inline-flex;
  gap: 6px;
  margin-left: 10px;
}
.filter-buttons button {
  background-color: #1b1b1b;
  color: #b0a06f;
  border: 1px solid #3c2c2c;
  border-radius: 6px;
  padding: 3px 8px;
  cursor: pointer;
  font-size: 0.8em;
  transition: background-color 0.3s;
}
.filter-buttons button:hover {
  background-color: #2a2a2a;
}

/* -------------------- OTHER COMPONENTS -------------------- */
.section { text-align: center; margin-bottom: 20px; }

select#numPlayers {
  padding: 5px;
  font-size: 1.2em;
  border: 1px solid #555;
  border-radius: 5px;
  background-color: #222;
  color: #eee;
  appearance: none;
}
button {
  padding: 10px 20px;
  font-size: 1em;
  background-color: #3c2c2c;
  border: none;
  border-radius: 8px;
  color: #f5f5f5;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(0,0,0,0.5);
  transition: background-color 0.3s;
}
button:hover { background-color: #5c3d3d; }

#gameGrid {
  display: none;
  margin-top: 30px;
  flex-direction: column;
  gap: 30px;
}
.player-box {
  border: 2px solid #444;
  padding: 15px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background-color: #1c1c1c;
  box-shadow: 0 0 10px #00000099;
}
#playerResults {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}
.player-output, .relic-output, .disorder-output {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.5em;
}
#gameGrid img {
  width: 100px;
  height: 100px;
  object-fit: contain;
  border-radius: 6px;
}
em.bold-italic { font-style: italic; font-weight: bold; color: #e2d7a7; }
.game-info-row {
  display: flex;
  justify-content: flex-start;
  gap: 40px;
  flex-wrap: wrap;
}
.info-container {
  border: 2px solid #444;
  padding: 15px;
  border-radius: 12px;
  background-color: #1c1c1c;
  box-shadow: 0 0 10px #00000099;
  display: flex;
  gap: 30px;
  justify-content: center;
  flex-wrap: wrap;
}
#monsterSection {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
  align-items: flex-start;
}
#monsterSection .player-output {
  display: flex;
  flex-direction: row;
  align-items: center;
}
</style>
</head>
<body>

<a href="index.html" class="back-button" title="Back to Game Selection">&#8592;</a>

<h1>Cthulhu: Death May Die (RNG)</h1>

<!-- ====================== COMPONENT FILTERS ====================== -->
<div class="filter-table-container">
  <h2>Components for generation — select grouped pools to include</h2>
  <table class="filter-table">
    <tr class="investigators-row">
      <th class="category">Investigators:</th>
      <td>
        <label><input type="checkbox" class="investigator" value="s1"> S1</label>
        <label><input type="checkbox" class="investigator" value="s2"> S2</label>
        <label><input type="checkbox" class="investigator" value="s3"> S3</label>
        <label><input type="checkbox" class="investigator" value="extra"> Extra</label>
        <span class="filter-buttons">
          <button onclick="toggleAllInRow('investigators-row', true)">Select All</button>
          <button onclick="toggleAllInRow('investigators-row', false)">Clear All</button>
        </span>
      </td>
    </tr>
    <tr class="pathologies-row">
      <th class="category">Pathologies:</th>
      <td>
        <label><input type="checkbox" class="pathology" value="s1"> S1</label>
        <label><input type="checkbox" class="pathology" value="s3"> S3</label>
        <label><input type="checkbox" class="pathology" value="extra"> Extra</label>
        <span class="filter-buttons">
          <button onclick="toggleAllInRow('pathologies-row', true)">Select All</button>
          <button onclick="toggleAllInRow('pathologies-row', false)">Clear All</button>
        </span>
      </td>
    </tr>
    <tr class="bosses-row">
      <th class="category">Bosses:</th>
      <td>
        <label><input type="checkbox" class="boss" value="Cthulhu"> Cthulhu</label>
        <label><input type="checkbox" class="boss" value="Hastur"> Hastur</label>
        <label><input type="checkbox" class="boss" value="Black Goat of the Woods"> Black Goat of the Woods</label>
        <label><input type="checkbox" class="boss" value="Yog-Sothoth"> Yog-Sothoth</label>
        <label><input type="checkbox" class="boss" value="Azathoth"> Azathoth</label>
        <label><input type="checkbox" class="boss" value="Tsathoggua"> Tsathoggua</label>
        <label><input type="checkbox" class="boss" value="Wicker Eddie"> Wicker Eddie</label>
        <span class="filter-buttons">
          <button onclick="toggleAllInRow('bosses-row', true)">Select All</button>
          <button onclick="toggleAllInRow('bosses-row', false)">Clear All</button>
        </span>
      </td>
    </tr>
    <tr class="episodes-row">
      <th class="category">Episodes:</th>
      <td>
        <label><input type="checkbox" class="episode" value="s1"> S1</label>
        <label><input type="checkbox" class="episode" value="s2"> S2</label>
        <label><input type="checkbox" class="episode" value="s3"> S3</label>
        <span class="filter-buttons">
          <button onclick="toggleAllInRow('episodes-row', true)">Select All</button>
          <button onclick="toggleAllInRow('episodes-row', false)">Clear All</button>
        </span>
      </td>
    </tr>
    <tr class="relics-row">
      <th class="category">Relics (Optional):</th>
      <td>
        <label><input type="checkbox" class="relic" value="s3"> S3</label>
        <label><input type="checkbox" class="relic" value="s4"> S4</label>
        <label><input type="checkbox" class="relic" value="extra"> Extra (KS exclusive)</label>
        <label><input type="checkbox" class="relic" value="animal"> Animal Allies</label>
        <span class="filter-buttons">
          <button onclick="toggleAllInRow('relics-row', true)">Select All</button>
          <button onclick="toggleAllInRow('relics-row', false)">Clear All</button>
        </span>
      </td>
    </tr>
    <tr class="monsters-row">
      <th class="category">Unknown Monsters (Optional):</th>
      <td>
        <label><input type="checkbox" class="monster" value="s1"> S1</label>
        <label><input type="checkbox" class="monster" value="s2"> S2</label>
        <label><input type="checkbox" class="monster" value="s3"> S3</label>
        <label><input type="checkbox" class="monster" value="extra"> Extra (Iron Maiden Pack)</label>
        <span class="filter-buttons">
          <button onclick="toggleAllInRow('monsters-row', true)">Select All</button>
          <button onclick="toggleAllInRow('monsters-row', false)">Clear All</button>
        </span>
      </td>
    </tr>
  </table>
</div>

<!-- =============== PLAYER COUNT + GENERATE =============== -->
<div class="section">
  <label>Number of players (1–5):
    <select id="numPlayers">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3" selected>3</option>
      <option value="4">4</option>
      <option value="5">5</option>
    </select>
  </label>
</div>

<div class="section">
  <button onclick="generate()">Generate</button>
</div>

<!-- =============== RESULTS =============== -->
<div id="gameGrid">
  <div id="playerResults"></div>
  <div class="game-info-row">
    <div class="info-container">
      <div id="episodeSection"></div>
      <div id="bossSection"></div>
    </div>
    <div class="info-container">
      <div id="monsterSection"></div>
    </div>
  </div>
</div>

<script>
/* =============== HELPER: TOGGLE ALL / CLEAR ALL =============== */
function toggleAllInRow(rowClass, state) {
  document.querySelectorAll(`.${rowClass} input[type="checkbox"]`).forEach(cb => cb.checked = state);
}

/* =============== BASE ARRAYS (with Chthonic fix) =============== */
const monsters1to25 = [
  "Bokrug", "Byakhee", "Chthonic Entity", "Deep One", "Dhole",
  "Dimensional Shambler", "Elder Thing", "Fear Eddie", "Fire Vampire", "Fisher from Outside",
  "Flying Polyp", "Ghast", "Ghoul", "Gug", "Gyaa-Yothn",
  "Hound of Tindalos", "Hunting Horror", "Nightgaunt", "Serpent Man", "Shoggoth",
  "Star Vampire", "Tcho-Tcho", "The Unnamable", "Undead Eddie", "Yugg"
];

/* Other arrays unchanged for brevity (same as your working version) */

/* =============== SANITIZATION FIX =============== */
function sanitizeFileName(name) {
  return name.toLowerCase().replace(/[’'"]/g,'')
    .replace(/\s+/g,'_')
    .replace(/[^a-z0-9_-]/g,'');
}
</script>
</body>
</html>
